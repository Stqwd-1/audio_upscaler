[project]
name = "audio-upscaler"
version = "0.1.0"
description = "Neural network for audio upscaling and super-resolution"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Stanislav Suharkov" },
]
keywords = ["audio", "super-resolution", "deep-learning", "upscaler", "pytorch", "gan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "tensorboard>=2.14",
    "tqdm>=4.65",
]

[project.optional-dependencies]
web = [
    "gradio>=4.0",
]
tuning = [
    "optuna>=3.5",
]
onnx = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Stqwd-1/audio_upscaler"

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["models", "data", "losses", "utils"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"